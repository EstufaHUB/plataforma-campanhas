<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Campanhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --pet-950:#0b2a31;--pet-900:#0e3a44;--pet-800:#124a56;--pet-700:#17606f;--pet-600:#1d7585;--pet-100:#dcecef;--pet-50:#eef6f7;
  --fundo:#f5f6f7;--sup:#fff;--borda:#e3e6e8;--borda-f:#cdd3d7;
  --tx:#1d2a2f;--tx2:#566469;--tx3:#8a979c;
  --verm:#b3261e;--verm-f:#fbeceb;--amar:#9a6200;--amar-f:#fdf3e1;--verde:#2e7d32;--verde-f:#e8f3e9;--azul:#285e8a;--azul-f:#e8f0f7;--roxo:#6b4fa0;--roxo-f:#f0ecf8;--cinza:#5f6b70;--cinza-f:#eef0f1;
  --raio:10px;--raio-sm:6px;--sombra:0 1px 2px rgba(10,40,48,.06),0 2px 8px rgba(10,40,48,.05);--sombra-f:0 12px 40px rgba(10,40,48,.25);
  --lat:240px;--fonte:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--fonte);font-size:14px;line-height:1.45;color:var(--tx);background:var(--fundo);-webkit-font-smoothing:antialiased}
a{color:var(--pet-700)}h1,h2,h3,h4{margin:0;line-height:1.25;color:var(--pet-950)}h1{font-size:1.4rem}h2{font-size:1.1rem}h3{font-size:.98rem}
svg.lucide{width:17px;height:17px;stroke-width:2;flex-shrink:0}
.muted{color:var(--tx2)}.small{font-size:.82rem}.num{font-variant-numeric:tabular-nums}.oculto{display:none!important}
/* layout */
.lateral{position:fixed;inset:0 auto 0 0;width:var(--lat);background:var(--pet-900);color:#d6e6e9;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.marca{display:flex;gap:10px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.marca-logo{width:34px;height:34px;border-radius:9px;background:var(--pet-600);display:grid;place-items:center;color:#fff}
.marca b{color:#fff;display:block;font-size:.95rem}.marca span{font-size:.75rem;color:#9fc0c7}
.menu{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#d6e6e9;text-decoration:none;font-weight:500}
.menu a:hover{background:rgba(255,255,255,.06)}.menu a.ativo{background:var(--pet-700);color:#fff}
.menu .cont{margin-left:auto;background:#e0a33a;color:#2b1a00;border-radius:10px;font-size:.72rem;padding:1px 7px;font-weight:700}
.lat-rodape{padding:12px 16px;font-size:.75rem;color:#9fc0c7;border-top:1px solid rgba(255,255,255,.08)}
.principal{margin-left:var(--lat);min-height:100vh;display:flex;flex-direction:column}
.topo{height:56px;background:var(--sup);border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:30}
.topo .migalha{color:var(--tx2);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .migalha a{text-decoration:none;color:var(--tx2)}.topo .migalha b{color:var(--tx)}
.btn-menu{display:inline-grid}
body.menu-oculto .lateral{transform:translateX(-100%)}body.menu-oculto .principal{margin-left:0}
.lateral,.principal{transition:transform .2s,margin-left .2s}
.aviso-demo[hidden]{display:none!important}
.aviso-demo{background:var(--amar-f);color:var(--amar);font-size:.78rem;padding:6px 24px;border-bottom:1px solid #f1dfb8;display:flex;gap:8px;align-items:center}
.conteudo{padding:20px 28px;max-width:1920px;width:100%}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.cab p{margin:4px 0 0;color:var(--tx2)}
/* comps */
.card{background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra)}
.card-p{padding:18px}.card+.card{margin-top:16px}.grade>.card+.card{margin-top:0}
.card-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--borda);flex-wrap:wrap}
.grade{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--borda-f);background:var(--sup);color:var(--tx);padding:8px 13px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--fundo)}.btn-p{background:var(--pet-700);border-color:var(--pet-700);color:#fff}.btn-p:hover{background:var(--pet-800)}
.btn-s{padding:5px 9px;font-size:.82rem}.btn-g{border-color:transparent;background:transparent}.btn-g:hover{background:var(--cinza-f)}
.btn-perigo{color:var(--verm);border-color:#eac3c0}.btn:disabled{opacity:.45;cursor:not-allowed}
.icone-btn{border:0;background:transparent;padding:5px;border-radius:6px;cursor:pointer;color:var(--tx2);display:inline-grid;place-items:center}.icone-btn:hover{background:var(--cinza-f);color:var(--tx)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--cinza-f);color:var(--cinza)}
.t-verde{background:var(--verde-f);color:var(--verde)}.t-amar{background:var(--amar-f);color:var(--amar)}.t-verm{background:var(--verm-f);color:var(--verm)}.t-azul{background:var(--azul-f);color:var(--azul)}.t-roxo{background:var(--roxo-f);color:var(--roxo)}.t-pet{background:var(--pet-50);color:var(--pet-700)}
.ponto{width:9px;height:9px;border-radius:50%;display:inline-block}.p-verde{background:#3a9a46}.p-amar{background:#e0a33a}.p-verm{background:#d0443a}.p-cinza{background:#a9b3b7}
.tabela-wrap{overflow-x:auto}
table.tab{width:100%;border-collapse:collapse;font-size:.86rem}
.tab th{text-align:left;font-weight:600;color:var(--tx2);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--borda);background:#fafbfb;white-space:nowrap}
.tab td{padding:10px 12px;border-bottom:1px solid var(--borda);vertical-align:middle}
.tab tr:last-child td{border-bottom:0}.tab tr.clic{cursor:pointer}.tab tr.clic:hover td{background:var(--pet-50)}
.farol{border-radius:999px;font-weight:600;font-size:.78rem;padding:3px 8px 3px 22px;border:1px solid transparent;background-repeat:no-repeat;background-position:8px center;background-size:8px 8px}
.farol.f-verde{background-color:#e3f4e8;color:#1f6b3a;border-color:#b9e0c4;background-image:radial-gradient(circle,#2e9d55 60%,transparent 62%)}
.farol.f-amar{background-color:#fff4d6;color:#8a5a00;border-color:#f1d999;background-image:radial-gradient(circle,#e0a100 60%,transparent 62%)}
.farol.f-verm{background-color:#fde7e5;color:#a8322a;border-color:#f3c3be;background-image:radial-gradient(circle,#d0443a 60%,transparent 62%)}
.farol.f-cinza{background-color:#f1f3f4;color:#5b6b70;border-color:#dfe3e5;background-image:radial-gradient(circle,#9aa9ae 60%,transparent 62%)}
.farol.f-azul{background-color:#e6f1f8;color:#1d5f86;border-color:#c3dcec;background-image:radial-gradient(circle,#2f80b8 60%,transparent 62%)}
.farol:disabled{opacity:1}
.tab tr.a-fase td{background:#f4f7f8;font-weight:700;color:var(--pet-900)}.tab tr.a-pais td:nth-child(2){padding-left:42px}
.tab tr.a-grupo td:nth-child(2),.tab tr.a-fase td:first-child{white-space:nowrap}
.sel-resp{padding:3px 6px;font-size:.8rem;min-width:118px}
.menu-barra{position:fixed;z-index:120;background:var(--sup);border:1px solid var(--borda);border-radius:10px;box-shadow:var(--sombra-f);padding:10px;min-width:230px;max-width:320px}
.chave-dep{gap:8px}.chave{width:28px;height:16px;border-radius:999px;background:#c9d1d4;position:relative;display:inline-block;transition:background .15s}
.chave i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.chave-dep.on .chave{background:var(--pet-600)}.chave-dep.on .chave i{left:14px}
.mb-sep{height:1px;background:var(--borda);margin:6px 0}
.mb-tit{font-weight:600;font-size:.88rem;line-height:1.3}
.mb-op{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;font:inherit;font-size:.85rem;color:var(--tx);cursor:pointer;text-align:left}
.mb-op:hover{background:var(--pet-50)}.mb-op svg{width:16px;height:16px}.mb-op.mb-ok{color:#1f6b3a;font-weight:600}
.msel{position:relative;display:inline-block}
.msel-btn{display:inline-flex;align-items:center;gap:8px;justify-content:space-between;min-width:150px;padding:7px 10px;border:1px solid var(--borda-f);border-radius:8px;background:var(--sup);font:inherit;font-size:.86rem;color:var(--tx);cursor:pointer}
.msel-btn svg{width:15px;height:15px;color:var(--tx2)}.msel-btn.ativo{border-color:var(--pet-600);background:var(--pet-50);color:var(--pet-800);font-weight:600}
.msel-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:60;background:var(--sup);border:1px solid var(--borda);border-radius:10px;box-shadow:var(--sombra-f);padding:6px;min-width:220px;max-height:320px;overflow:auto}
.msel-op{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:.86rem;cursor:pointer;white-space:nowrap}.msel-op:hover{background:var(--pet-50)}
.msel-limpar{width:100%;margin-top:4px;border:0;border-top:1px solid var(--borda);background:none;padding:7px;font:inherit;font-size:.82rem;color:var(--pet-700);cursor:pointer}
.chip-link{display:inline-flex;align-items:center;gap:8px;max-width:340px;padding:5px 12px 5px 8px;border-radius:8px;background:#f1f3f4;border:1px solid #e3e6e8;color:var(--tx);text-decoration:none;font-size:.86rem}.chip-link:hover{background:#e8eaed}.chip-link svg{flex-shrink:0}.chip-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;margin-bottom:14px;flex-wrap:wrap}
.cc-esq{display:flex;gap:16px;align-items:center;min-width:0}
.cc-logo{width:64px;height:64px;border-radius:12px;background:var(--pet-950);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.25rem;flex-shrink:0;letter-spacing:-.3px}
.logo-img{background:#fff!important;border:1px solid var(--borda)}.logo-img img{width:78%;height:78%;object-fit:contain}
.cli-logo{width:44px;height:44px;border-radius:10px;background:var(--pet-950);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.cc-cli{font-size:.86rem;color:var(--tx2)}.cc h1{margin:2px 0 6px;font-size:1.5rem}
.cc-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--tx2)}
.cc-pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--tx)}.cc-pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.cc-sep{width:1px;height:16px;background:var(--borda)}.cc-ini{display:inline-flex;align-items:center;gap:5px}.cc-ini svg{width:15px;height:15px}.cc-band{letter-spacing:2px}
.cc-dir{display:flex;gap:8px;align-items:center}.menu-wrap{position:relative}.menu-wrap .btn svg{width:15px;height:15px}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);z-index:60;background:var(--sup);border:1px solid var(--borda);border-radius:10px;box-shadow:var(--sombra-f);padding:6px;min-width:220px}
.menu-pop button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;font-size:.86rem;color:var(--tx);cursor:pointer;text-align:left}.menu-pop button:hover{background:var(--pet-50)}.menu-pop svg{width:16px;height:16px}
.kpi2{display:flex;gap:14px;align-items:flex-start;padding:18px}.k-ic{width:36px;height:36px;border-radius:9px;background:var(--pet-50);color:var(--pet-700);display:grid;place-items:center;flex-shrink:0}.k-ic svg{width:19px;height:19px}
.k-rot{font-size:.84rem;color:var(--tx2)}.k-val{font-size:1.45rem;font-weight:700;color:var(--pet-950);margin-top:6px;line-height:1.1}.k-dia{font-size:.9rem;color:var(--tx);margin-top:2px}.k-sub{font-size:.74rem;color:var(--tx2);margin-top:8px}
.k-prog{align-items:center}
.h-ic{display:flex;align-items:center;gap:8px}.h-ic svg{width:19px;height:19px;color:var(--pet-600)}
.sep-h{height:1px;background:var(--borda);margin:14px 0}
.tag.t-verde-c{background:#e3f4e8;color:#1f6b3a}
.bud{display:grid;grid-template-columns:auto auto;gap:4px 22px;justify-content:start}
.st-passo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}.st-passo .cc-pill{font-size:.9rem}
.st-geral{display:flex;align-items:center;gap:0;position:relative;max-width:240px;margin-top:6px}.st-geral i{position:absolute;left:12px;width:9px;height:9px;border-radius:50%}.st-geral select{width:100%;padding:9px 10px 9px 28px;border-radius:8px}
.linha-tempo{list-style:none;margin:0;padding:6px 0}.linha-tempo li{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 18px 12px 44px;border-bottom:1px solid var(--borda)}.linha-tempo li:last-child{border-bottom:0}
.linha-tempo li::before{content:"";position:absolute;left:25px;top:0;bottom:0;width:2px;background:#e3e6e8}.linha-tempo li:first-child::before{top:20px}.linha-tempo li:last-child::before{bottom:calc(100% - 20px)}
.lt-ponto{position:absolute;left:19px;top:15px;width:14px;height:14px;border-radius:50%;background:#cfd6d9;border:3px solid var(--sup)}.linha-tempo li.atual .lt-ponto{background:var(--pet-600);box-shadow:0 0 0 3px #d4eef0}
.lt-nome{color:var(--tx);text-decoration:none;font-size:.88rem}.linha-tempo li.atual .lt-nome{color:var(--pet-700);font-weight:500}.lt-nome:hover{text-decoration:underline}.lt-data{white-space:nowrap;color:var(--pet-800)}
.paises-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px 18px}
.pais-card{border:1px solid var(--borda);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--tx)}.pais-card:hover{border-color:var(--pet-600)}
.pc-nome{font-weight:600;font-size:1rem}.pc-data{margin-top:8px;font-size:.86rem;color:var(--tx2);display:flex;align-items:center;gap:10px}
@media (max-width:640px){.cc{padding:14px}.cc-logo{width:48px;height:48px;font-size:1rem}.cc h1{font-size:1.25rem}}
.pb-bloco{margin-top:4px}.pb-topo{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);gap:16px 24px;align-items:start;margin-bottom:12px}.pb-rot{display:block;margin-bottom:6px}.sec-canal{border:1px solid var(--borda);border-radius:12px;padding:16px;background:#fafbfb}.sec-tit{font-weight:700;color:var(--pet-900);margin-bottom:12px;font-size:.98rem}.pb-bloco{display:flex;flex-direction:column}.pb-bloco>.pb-topo{order:0}.pb-bloco>.tabela-wrap{order:1}.pb-bloco>.pb-canais{order:2;margin-top:16px}.pb-can-cab{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.pb-bud{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}.pb-bud .seg{flex-shrink:0}.pb-bud select,.pb-bud input{flex-shrink:0}.pb-bud input{min-width:140px}.pb-bud select{min-width:84px}.pb-bud .seg button{white-space:nowrap}
@media (max-width:760px){.pb-bud{flex-wrap:wrap}}
@media (max-width:760px){.pb-topo{grid-template-columns:1fr}}

.canal-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.canal-grade{align-items:stretch;grid-auto-rows:1fr}.canal-card{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:18px;text-decoration:none;color:var(--tx);border:1px solid var(--borda);transition:border-color .12s,box-shadow .12s}.canal-card:hover{border-color:var(--pet-600)}
.canal-card.sel{border-color:var(--pet-600);box-shadow:0 0 0 2px #d4eef0}
.cc-top{display:flex;justify-content:space-between;align-items:center}.cc-nome{font-weight:600;margin-top:12px;color:var(--tx2)}.cc-valor{font-size:1.5rem;font-weight:700;color:var(--pet-950);margin-top:2px}
.inp-uso{width:130px;text-align:right;padding:5px 8px;border:1px solid var(--borda-f);border-radius:6px;font:inherit;font-size:.86rem}
.sug-kpi{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 18px 0}
.apres{position:relative;width:100%;aspect-ratio:16/9;background:#f1f3f4;border-top:1px solid var(--borda)}.apres iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.legenda-farol{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--tx2);padding:10px 18px}.legenda-farol span{display:inline-flex;align-items:center;gap:6px}.legenda-farol i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tab tr.mudou td{background:#fff8e6}.tab tr.atrasada td:first-child{box-shadow:inset 3px 0 0 #d0443a}
.tab .dir{text-align:right}

.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

const dt = s => new Date(s+'T00:00:00Z');
const iso = d => d.toISOString().slice(0,10);
const addDias = (s,n) => { const d=dt(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const dow = s => dt(s).getUTCDay();
const difDias = (a,b) => Math.round((dt(b)-dt(a))/864e5);
const DSEM = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fd = s => s ? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : '—';
const fdc = s => s ? s.slice(8,10)+'/'+s.slice(5,7) : '—';
const fds = s => s ? fd(s)+' ('+DSEM[dow(s)].slice(0,3)+')' : '—';

function criarCtx(feriados){
  const ag = S.agencia, sets = {};
  const nomes = {};
  const get = cal => {
    if (sets[cal]) return sets[cal];
    const st = new Set(); nomes[cal] = {};
    for (const f of feriados) {
      if (!f.ativo) continue;
      let vale = false;
      if (cal === 'AG') vale = f.abrang==='Agência' || (f.pais===ag.pais && (f.abrang==='Nacional' || (f.abrang==='Estadual'&&f.estado===ag.estado) || (f.abrang==='Municipal'&&f.cidade===ag.cidade)));
      else vale = f.pais===cal && f.abrang==='Nacional';
      if (vale) { st.add(f.data); nomes[cal][f.data] = f.nome; }
    }
    return sets[cal] = st;
  };
  return {
    util: (s,cal) => { if (cal==='CORR') return true; const w = dow(s); return w!==0 && w!==6 && !get(cal).has(s); },
    motivo: (s,cal) => { if (cal==='CORR') return null; const w=dow(s); if (w===0) return 'domingo'; if (w===6) return 'sábado'; get(cal); return nomes[cal][s] ? 'feriado: '+nomes[cal][s] : null; },
    fer: cal => get(cal)
  };
}
let CTX = null;
const ctx = () => CTX || (CTX = criarCtx(S.feriados));
function proxU(s,cal,c){ let i=0; do { s=addDias(s,1); } while(!c.util(s,cal) && ++i<400); return s; }
function antU(s,cal,c){ let i=0; do { s=addDias(s,-1); } while(!c.util(s,cal) && ++i<400); return s; }
const paraFrente = (s,cal,c) => c.util(s,cal) ? s : proxU(s,cal,c);
const paraTras  = (s,cal,c) => c.util(s,cal) ? s : antU(s,cal,c);
/* o dia de início conta como 1º dia */
function fimDe(ini,n,cal,c){ let d=ini; for(let i=1;i<n;i++) d=proxU(d,cal,c); return d; }
function iniDe(fim,n,cal,c){ let d=fim; for(let i=1;i<n;i++) d=antU(d,cal,c); return d; }
function uteisEntre(a,b,cal,c){ // passos em dias úteis de a até b (negativo se b < a)
  if (a===b) return 0; let n=0, d=a;
  if (a<b) { while (d<b && n<999) { d=proxU(d,cal,c); n++; } return d>b ? n-1 : n; }
  while (d>b && n<999) { d=antU(d,cal,c); n++; } return d<b ? -(n-1) : -n;
}
const hojeUtil = (cal='AG') => paraFrente(HOJE,cal,ctx());

/* =====================================================================
   3. MOTOR DE CRONOGRAMA REVERSO
   ===================================================================== */
function nomeTarefa(t, base){ return t.nome.replace('{base}', (IDIOMAS[base]||base).toLowerCase()); }

function montarGrafo(camp, modelo){
  const base = camp.idiomaBase, porTpl = Object.fromEntries(modelo.map(t=>[t.id,t])), nos = {}, excl = new Set(camp.excluidas||[]);
  for (const t of modelo) {
    if (t.escopo==='global') nos[t.id] = {id:t.id,t,pais:null,skip: excl.has(t.id)};
    else for (const p of camp.paises) nos[t.id+'@'+p.cod] = {id:t.id+'@'+p.cod,t,pais:p.cod,skip: (!!t.trad && p.idioma===base) || excl.has(t.id) || excl.has(t.id+'@'+p.cod)};
  }
  for (const n of Object.values(nos)) {
    n.deps0 = [];
    for (const [de,tipo] of n.t.deps) {
      const pt = porTpl[de]; if (!pt) continue;
      if (pt.escopo==='global') n.deps0.push({id:de,tipo});
      else if (n.pais) n.deps0.push({id:de+'@'+n.pais,tipo});
      else for (const p of camp.paises) n.deps0.push({id:de+'@'+p.cod,tipo});
    }
  }
  // tarefa que "não se aplica" (país no idioma-base) é atravessada: o sucessor herda as predecessoras dela
  const resolver = (lista, vis) => {
    const out = [];
    for (const d of lista) {
      const alvo = nos[d.id]; if (!alvo || vis.has(d.id)) continue;
      if (alvo.skip) { const v2 = new Set(vis); v2.add(d.id); for (const r of resolver(alvo.deps0, v2)) out.push({id:r.id, tipo: d.tipo==='SS' ? 'SS' : r.tipo}); }
      else out.push(d);
    }
    return out;
  };
  const lista = Object.values(nos).filter(n=>!n.skip);
  for (const n of lista) {
    const m = {};
    for (const d of resolver(n.deps0, new Set())) if (!m[d.id] || d.tipo==='FS') m[d.id] = d.tipo;
    n.deps = Object.entries(m).map(([id,tipo])=>({id,tipo}));
    n.cal = n.t.corridos ? 'CORR' : (n.t.area==='Validadores locais' && n.pais) ? n.pais : 'AG';
    n.dur = Math.max(1, +n.t.dur||1); n.succ = [];
  }
  const porId = Object.fromEntries(lista.map(n=>[n.id,n]));
  for (const n of lista) for (const d of n.deps) porId[d.id].succ.push({id:n.id,tipo:d.tipo});
  // ordem topológica
  const grau = Object.fromEntries(lista.map(n=>[n.id,n.deps.length])), fila = lista.filter(n=>!n.deps.length), ordem = [];
  while (fila.length) { const n = fila.shift(); ordem.push(n); for (const s of n.succ) if (--grau[s.id]===0) fila.push(porId[s.id]); }
  if (ordem.length !== lista.length) throw new Error('O modelo tem dependências em círculo.');
  return {ordem, porId};
}

/* opções: fixos = {id:{ini,fim}} (tarefas concluídas/em andamento), naoAntesDe = data mínima para tarefas não iniciadas */
function calcularCronograma(camp, op = {}){
  const c = op.ctx || ctx(), modelo = op.modelo || camp.modelo, fixos = op.fixos || {};
  const {ordem, porId} = montarGrafo(camp, modelo);
  const lanc = cod => (camp.paises.find(p=>p.cod===cod)||{}).lancamento || camp.lancamento;
  // 1) passagem de trás para frente: data mais tarde possível (LS/LF)
  for (const n of [...ordem].reverse()) {
    let lf = null, lsCap = null;
    if (!n.succ.length) lf = paraTras(n.pais ? lanc(n.pais) : camp.lancamento, n.cal, c);
    for (const s of n.succ) {
      const S2 = porId[s.id];
      if (s.tipo==='FS') { const v = antU(S2.LS, n.cal, c); if (!lf || v<lf) lf = v; }
      else { const v = paraTras(S2.LS, n.cal, c); if (!lsCap || v<lsCap) lsCap = v; }
    }
    let ls = lf ? iniDe(lf, n.dur, n.cal, c) : null;
    if (lsCap && (!ls || lsCap<ls)) ls = lsCap;
    n.LS = ls; n.LF = fimDe(ls, n.dur, n.cal, c);
  }
  const inicio = ordem.reduce((m,n)=> !m||n.LS<m ? n.LS : m, null);
  // 2) passagem para frente a partir do início calculado: datas planejadas (ES/EF)
  for (const n of ordem) {
    const fx = fixos[n.id]; let es;
    if (fx && fx.ini) es = fx.ini;
    else {
      es = n.deps.length ? null : inicio;
      for (const d of n.deps) { const p = porId[d.id]; const v = d.tipo==='FS' ? proxU(p.EF, n.cal, c) : paraFrente(p.ES, n.cal, c); if (!es || v>es) es = v; }
      es = paraFrente(es, n.cal, c);
      if (op.naoAntesDe && es < op.naoAntesDe) es = paraFrente(op.naoAntesDe, n.cal, c);
      if (n.t.fimNoLanc && es < n.LS) es = n.LS;          // última etapa termina exatamente no lançamento
      if (es > n.LS) es = n.LS;                            // prazo curto: o lançamento é mantido e a etapa fica no passado (atrasada)
    }
    let ef = (fx && fx.fim) || fimDe(es, n.dur, n.cal, c);
    // o lançamento manda: datas planejadas nunca passam do limite calculado de trás para frente (só um ajuste manual no Gantt pode)
    if (!(fx && fx.manual) && es > n.LS) { es = n.LS; ef = n.LF; }
    else if (!(fx && fx.manual) && ef > n.LF) ef = n.LF;
    n.ES = es; n.EF = ef;
    n.folga = uteisEntre(n.ES, n.LS, n.cal, c);
  }
  const tarefas = ordem.map(n => ({
    id:n.id, tid:n.t.id, fase:n.t.fase, nome:(camp.renomeadas||{})[n.id] || nomeTarefa(n.t, camp.idiomaBase), area:n.t.area, pais:n.pais, dur:n.dur, cal:n.cal,
    deps:n.deps, escopo:n.t.escopo, marco:!!n.t.fimNoLanc, ES:n.ES, EF:n.EF, LS:n.LS, LF:n.LF, folga:n.folga, critico:n.folga<=0, status:'Não iniciada'
  }));
  const fim = tarefas.filter(t=>t.marco);
  const inviaveis = fim.filter(t=>t.EF > lanc(t.pais)).map(t=>({pais:t.pais, fim:t.EF, lanc:lanc(t.pais), atraso:uteisEntre(lanc(t.pais),t.EF,'AG',c)}));
  return {tarefas, inicio, inviaveis};
}
/* recalcula folga, caminho crítico e viabilidade depois de um ajuste manual (datas planejadas ficam como estão) */
function recalcFolgas(camp){
  const cx = ctx(), ts = camp.crono.tarefas, porId = Object.fromEntries(ts.map(t=>[t.id,t])), succ = {};
  ts.forEach(t=>succ[t.id]=[]); ts.forEach(t=>t.deps.forEach(d=>{ if (succ[d.id]) succ[d.id].push(d.tipo==='FS'?{id:t.id,tipo:'FS'}:{id:t.id,tipo:'SS'}); }));
  const lanc = cod => (camp.paises.find(p=>p.cod===cod)||{}).lancamento || camp.lancamento;
  for (const t of [...ts].reverse()) {
    let lf = null, lsCap = null;
    if (!succ[t.id].length) lf = paraTras(t.pais ? lanc(t.pais) : camp.lancamento, t.cal, cx);
    for (const s of succ[t.id]) { const S2 = porId[s.id];
      if (s.tipo==='FS') { const v = antU(S2.LS, t.cal, cx); if (!lf || v<lf) lf = v; }
      else { const v = paraTras(S2.LS, t.cal, cx); if (!lsCap || v<lsCap) lsCap = v; } }
    let ls = lf ? iniDe(lf, t.dur, t.cal, cx) : null; if (lsCap && (!ls || lsCap<ls)) ls = lsCap;
    t.LS = ls; t.LF = fimDe(ls, t.dur, t.cal, cx); t.folga = uteisEntre(t.ES, t.LS, t.cal, cx); t.critico = t.folga<=0;
  }
  camp.crono.inviaveis = ts.filter(t=>t.marco && t.EF > lanc(t.pais)).map(t=>({pais:t.pais, fim:t.EF, lanc:lanc(t.pais), atraso:uteisEntre(lanc(t.pais),t.EF,'AG',cx)}));
}
/* etapas seguintes que passam a começar antes do que a dependência permite */
function conflitosMov(camp, t, ES, EF){
  const cx = ctx();
  return camp.crono.tarefas.filter(s=>s.status!=='Concluída' && s.deps.some(d=>d.id===t.id && (d.tipo==='FS' ? proxU(EF,s.cal,cx) > s.ES : paraFrente(ES,s.cal,cx) > s.ES)));
}
/* aplica o ajuste; com empurrar=true, as etapas que dependem dela (direta ou indiretamente) andam para frente mantendo a duração */
function moverTarefa(camp, tid, ES, EF, empurrar){
  const cx = ctx(), ts = camp.crono.tarefas, porId = Object.fromEntries(ts.map(t=>[t.id,t])), t = porId[tid];
  t.ES = ES; t.EF = EF; t.dur = uteisEntre(ES, EF, t.cal, cx) + 1; t.manual = true;
  const movidas = [], travadas = [];
  if (empurrar) { const afet = new Set([tid]);
    for (const s of ts) { if (s===t || s.status==='Concluída') continue;
      let es = null;
      for (const d of s.deps) { if (!afet.has(d.id)) continue; const p = porId[d.id]; const v = d.tipo==='FS' ? proxU(p.EF, s.cal, cx) : paraFrente(p.ES, s.cal, cx); if (!es || v>es) es = v; }
      if (es && es > s.LS) { es = s.LS > s.ES ? s.LS : s.ES; travadas.push(s); }   // não passa do limite: o lançamento fica fixo
      if (es && es > s.ES) { s.ES = es; s.EF = fimDe(es, s.dur, s.cal, cx); if (s.EF > s.LF && s.LF >= s.ES) s.EF = s.LF; afet.add(s.id); movidas.push(s); }
    } }
  recalcFolgas(camp);
  movidas.travadas = travadas; return movidas;
}
/* exclui etapas do cronograma da campanha: quem dependia delas passa a depender das anteriores; as outras datas não mudam */
function excluirEtapas(camp, ids, chaves){
  const ts = camp.crono.tarefas, rem = new Set(ids), por = Object.fromEntries(ts.map(t=>[t.id,t]));
  const herdar = (d, vis) => { if (!rem.has(d.id)) return [d]; if (vis.has(d.id)) return []; vis.add(d.id);
    return por[d.id].deps.flatMap(e => herdar({id:e.id, tipo: d.tipo==='SS' ? 'SS' : e.tipo}, vis)); };
  for (const t of ts) { if (rem.has(t.id)) continue; const m = {};
    for (const d of t.deps) for (const r of herdar(d, new Set())) if (!m[r.id] || r.tipo==='FS') m[r.id] = r.tipo;
    t.deps = Object.entries(m).map(([id,tipo])=>({id,tipo})); }
  camp.crono.tarefas = ts.filter(t=>!rem.has(t.id));
  camp.excluidas = [...new Set([...(camp.excluidas||[]), ...chaves])];
  recalcFolgas(camp);
}
function rotuloEtapa(camp, chave){ const [tid, pp] = chave.split('@'), tpl = camp.modelo.find(m=>m.id===tid);
  const nome = (camp.renomeadas||{})[chave] || (tpl ? nomeTarefa(tpl, camp.idiomaBase) : tid); return nome + (pp ? ' ('+pp+')' : ''); }
function snapshotCrono(c){ c.cronoHist.unshift({versao:c.crono.versao, data:c.crono.calculadoEm, motivo:c.crono.motivo, lancamento:c.crono.lancamento, tarefas:JSON.parse(JSON.stringify(c.crono.tarefas))}); }
/* move a etapa mantendo a corrente ligada: as seguintes acompanham (para frente ou para trás)
   e, se ela passar a começar antes do fim de uma anterior, a anterior recua junto */
function moverConectado(camp, tid, ES, EF){
  const cx = ctx(), ts = camp.crono.tarefas, por = Object.fromEntries(ts.map(t=>[t.id,t])), t = por[tid], movidas = new Set(), travadas = [];
  t.ES = ES; t.EF = EF; t.dur = uteisEntre(ES, EF, t.cal, cx) + 1; t.manual = true;
  const puxar = x => { for (const d of x.deps) { const p = por[d.id]; if (!p || p.status!=='Não iniciada') continue;
      if (d.tipo==='FS') { const lim = antU(x.ES, p.cal, cx); if (p.EF > lim) { p.EF = lim; p.ES = iniDe(lim, p.dur, p.cal, cx); p.manual = true; movidas.add(p.id); puxar(p); } }
      else if (p.ES > x.ES) { p.ES = paraTras(x.ES, p.cal, cx); p.EF = fimDe(p.ES, p.dur, p.cal, cx); p.manual = true; movidas.add(p.id); puxar(p); } } };
  puxar(t);
  const succ = {}; ts.forEach(x=>x.deps.forEach(d=>(succ[d.id] = succ[d.id]||[]).push(x.id)));
  const desc = new Set(), fila = [tid, ...movidas]; while (fila.length) for (const sid of succ[fila.shift()]||[]) if (!desc.has(sid)) { desc.add(sid); fila.push(sid); }
  for (const s of ts) { if (s===t || !desc.has(s.id) || s.status!=='Não iniciada' || s.marco) continue;
    let es = null; for (const d of s.deps) { const p = por[d.id]; if (!p) continue; const v = d.tipo==='FS' ? proxU(p.EF, s.cal, cx) : paraFrente(p.ES, s.cal, cx); if (!es || v>es) es = v; }
    if (!es) continue;
    if (es > s.LS) { es = s.LS; travadas.push(s); }   // não passa do limite: o lançamento fica fixo
    if (es!==s.ES) { s.ES = es; s.EF = fimDe(es, s.dur, s.cal, cx); if (s.manual) s.manual = true; movidas.add(s.id); } }
  recalcFolgas(camp);
  const r = [...movidas].map(id=>por[id]); r.travadas = travadas; return r;
}
function novasDatasArraste(t, modo, dd){
  const cx = ctx();
  const lim = t.marco ? t.LF : null;   // a etapa de lançamento não passa da data de lançamento
  if (modo==='mover') { let es = paraFrente(addDias(t.ES, dd), t.cal, cx), ef = fimDe(es, t.dur, t.cal, cx); if (lim && ef > lim) { ef = lim; es = iniDe(lim, t.dur, t.cal, cx); } return {ES:es, EF:ef}; }
  if (modo==='ini') { let es = paraFrente(addDias(t.ES, dd), t.cal, cx); if (es > t.EF) es = paraTras(t.EF, t.cal, cx); return {ES:es, EF:t.EF}; }
  let ef = paraTras(addDias(t.EF, dd), t.cal, cx); if (ef < t.ES) ef = paraFrente(t.ES, t.cal, cx); if (lim && ef > lim) ef = lim;
  return {ES:t.ES, EF:ef};
}
function statusExib(t){ if (t.status==='Concluída' || t.status==='Cancelada') return t.status; if (t.EF < HOJE) return 'Atrasada'; if (t.status==='Não iniciada' && t.ES < HOJE) return 'Atrasada'; return t.status; }
function fixosDe(tarefas){ const f={}; for (const t of tarefas) { if (t.manual && t.status!=='Concluída') f[t.id]={ini:t.ES,fim:t.EF,manual:true}; else if (t.status==='Concluída') f[t.id]={ini:t.ES,fim:t.EF}; else if (t.status!=='Não iniciada' && t.status!=='Cancelada') f[t.id]={ini:t.ES}; } return f; }

let S;
const CHAVE = 'prototipo-campanhas-ptx-v2';
let seq = 1000; const novoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function feriadosIniciais(){

function migrarAcoes(c){
  const cx = ctx();

    const doModelo = (a.hist||[])[0] && a.hist[0].o==='Copiada do cronograma padrão';
    const alvo = doModelo ? c.crono.tarefas.filter(t=>t.nome===a.nome) : [];
    if (alvo.length) { for (const t of alvo) {
        if (a.status!=='Não iniciada' && t.status==='Não iniciada') t.status = a.status;
        if (a.descricao) t.descricao = a.descricao; if (a.prioridade && a.prioridade!=='Média') t.prioridade = a.prioridade;
        if ((a.coment||[]).length) t.coment = [...(t.coment||[]), ...a.coment];
        if ((a.hist||[]).length > 1) t.hist = [...(t.hist||[]), ...a.hist.slice(1)]; }
      continue; }
    if (doModelo) continue;   // ação do modelo cuja etapa não existe mais
    // ação criada à mão: vira um item do cronograma com as datas que tinha
    const tid = 'X'+Math.random().toString(36).slice(2,9), area = AREAS.includes(a.resp) ? a.resp : 'Atendimento';
    const ini = paraFrente(a.inicio || a.prazo || HOJE, 'AG', cx); let fim = paraTras(a.prazo || a.inicio || HOJE, 'AG', cx); if (fim < ini) fim = ini;
    c.modelo.push({id:tid, fase:1, nome:a.nome, area, dur:uteisEntre(ini,fim,'AG',cx)+1, escopo:a.pais?'pais':'global', deps:[], item:true});
    if (a.pais) c.excluidas = [...(c.excluidas||[]), ...c.paises.filter(p=>p.cod!==a.pais).map(p=>tid+'@'+p.cod)];
    c.crono.tarefas.push({id:a.pais?tid+'@'+a.pais:tid, tid, fase:1, nome:a.nome, area, pais:a.pais||null, dur:uteisEntre(ini,fim,'AG',cx)+1, cal:'AG', deps:[], escopo:a.pais?'pais':'global', marco:false,
      ES:ini, EF:fim, LS:ini, LF:fim, folga:0, critico:false, status:a.status||'Não iniciada', manual:true,
      descricao:a.descricao||'', prioridade:a.prioridade||'Média', pessoa:AREAS.includes(a.resp)?'':(a.resp||''), coment:a.coment||[], hist:a.hist||[]});
  }

function migrarLancamento(){ CTX = null; let mudou = false;
  if (S.modelo && S.modelo.origem!==VERSAO_MODELO_PLANILHA && ehEquipe()) {
    S.modeloHist.unshift({versao:S.modelo.versao, data:S.modelo.data, tarefas:S.modelo.tarefas});
    S.modelo = {versao:S.modelo.versao+1, data:HOJE, origem:VERSAO_MODELO_PLANILHA, tarefas:JSON.parse(JSON.stringify(MODELO_PADRAO))}; mudou = true; }
  // canais que saíram da lista viram entregáveis (o calendário editorial continua para quem tinha orgânico)
  const CANAL_P_ENTREG = {'Email Marketing':'Email marketing','Conteúdo orgânico / Social Media':'Assets orgânicos'};
  for (const c of S.campanhas) if ((c.canais||[]).some(k=>k in CANAL_P_ENTREG)) {
    const novos = c.canais.filter(k=>k in CANAL_P_ENTREG).map(k=>CANAL_P_ENTREG[k]);
    c.entregaveisTipos = [...new Set([...(c.entregaveisTipos||[]), ...novos])];
    c.canais = c.canais.filter(k=>!(k in CANAL_P_ENTREG)); mudou = true; }
  if (ehEquipe()) for (const c of S.campanhas) { if (!c.crono || !c.paises.length) continue; const ls = [...new Set(c.paises.map(p=>p.idioma||PAISES[p.cod].i))];

      try { aplicarCronograma(c, calcularCronograma(c, {fixos:fixosDe(c.crono.tarefas), naoAntesDe:hojeUtil()}), `Idioma-base corrigido para ${IDIOMAS[ls[0]]||ls[0]}: sem etapas de tradução`); mudou = true; } catch(e){ console.error(e); } } }
  for (const c of S.campanhas) if (!c.etapasNovas && c.modelo) {
    const mapa = m => FASE_POR_ID[m.id] || FASE_ANTIGA[m.fase] || m.fase;

    const difPais = c.paises.some(p=>p.lancamento!==c.lancamento);

  }
  if ((S.migr||0) < 2) { S.migr = 2; mudou = true; }
  if (mudou) salvar(); }

      if (ult && ult.resultado!=='Aprovado' && (e.etapa==='ajuste_conteudo'||e.etapa==='ajuste_asset')) add('repr-'+e.id+'-'+e.aprovacoes.length, {tipo:'verm',ic:'x-circle',t:`${ult.tipo} ${ult.resultado.toLowerCase()}: ${e.nome}`,d:ult.coment||c.nome,link:`#/campanha/${c.id}/entregaveis`});
    });
    if (c.cronoHist.length && c.crono.calculadoEm>=addDias(HOJE,-7) && c.crono.motivo!=='Cálculo inicial') add('alt-'+c.id+'-'+c.crono.versao, {tipo:'azul',ic:'calendar-range',t:`Prazos alterados em “${c.nome}” (versão ${c.crono.versao})`,d:c.crono.motivo,link:`#/campanha/${c.id}/cronograma`});
    const dl = difDias(HOJE, c.lancamento);
    if (dl>=0 && dl<=14) add('lanc-'+c.id, {tipo:'pet',ic:'rocket',t:`“${c.nome}” lança em ${dl} dias (${fd(c.lancamento)})`,d:cl,link:`#/campanha/${c.id}/visao`});
    riscosPais(c).forEach(r=>add('risco-'+c.id+r.cod, {tipo:'verm',ic:'flag',t:`${pais(r.cod)} com risco de atraso em “${c.nome}”`,d:r.motivo,link:`#/campanha/${c.id}/mercados`}));
  }
  return [...N.values()];
}
function riscosPais(c){
  const out = [];
  for (const p of c.paises) {
    const inv = (c.crono.inviaveis||[]).find(i=>i.pais===p.cod);
    if (inv) { out.push({cod:p.cod,motivo:`Lançamento só seria possível em ${fd(inv.fim)}`}); continue; }
    const atr = c.crono.tarefas.filter(t=>t.pais===p.cod && statusExib(t)==='Atrasada');
    if (atr.length && !naoIniciada(c)) out.push({cod:p.cod,motivo:atr.length+' etapa(s) do país atrasada(s)'});
    else { const t = c.traducoes[p.cod]; if (t && (t.status==='Bloqueada' || t.desatualizada)) out.push({cod:p.cod,motivo: t.desatualizada?'Tradução desatualizada (master mudou)':'Tradução bloqueada'}); }
  }
  return out;
}

/* desfazer (Ctrl+Z) e refazer (Ctrl+Shift+Z ou Ctrl+Y): guarda o estado da campanha aberta a cada mudança */
const DESF = {};

function capturarDesfazer(r){ if (r[0]!=='campanha' || !ehEquipe()) return; const c = camp(r[1]); if (!c) return;
  const j = JSON.stringify(c), d = DESF[c.id] || (DESF[c.id] = {pilha:[], refazer:[], atual:j});

  const bD = $('[data-act="desfazer"]'), bR = $('[data-act="refazer"]'); if (bD) bD.disabled = !d.pilha.length; if (bR) bR.disabled = !d.refazer.length; }
function trocarCampanha(id, json){ const i = S.campanhas.findIndex(c=>c.id===id); if (i<0) return; S.campanhas[i] = JSON.parse(json); DESF[id].atual = json; salvar(); render(); }

  const de = refazer ? d.refazer : d.pilha, para = refazer ? d.pilha : d.refazer; if (!de.length) return toast(refazer?'Nada para refazer.':'Nada para desfazer.');
  para.push(d.atual); trocarCampanha(r[1], de.pop()); toast(refazer?'Refeito.':'Desfeito. Ctrl+Shift+Z refaz.'); }
document.addEventListener('keydown', e => { if (!(e.ctrlKey || e.metaKey) || e.altKey) return; const k = e.key.toLowerCase(); if (k!=='z' && k!=='y') return;

function alertasCampanha(c){

  else if (naoIniciada(c) && ini < HOJE) s += `<div class="alerta verm"><i data-lucide="alarm-clock-off"></i><div><b>O briefing deveria ter sido recebido em ${fds(ini)}.</b> Nenhuma etapa foi iniciada. Use “Recalcular a partir de hoje” na aba Cronograma para ver se ainda é possível lançar em ${fd(c.lancamento)}.</div></div>`;

  return s;
}

  if ((m = u.match(/docs\.google\.com\/(document|spreadsheets)\/d\/([\w-]+)/))) return 'https://docs.google.com/'+m[1]+'/d/'+m[2]+'/preview';
  if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  if ((m = u.match(/canva\.com\/design\/([\w-]+)\/([\w-]+)/))) return 'https://www.canva.com/design/'+m[1]+'/'+m[2]+'/view?embed';
  return null; }

/* move todos os países de uma etapa pelo mesmo número de dias */
function moverGrupo(c, tid, dd, solto, modo='mover'){
  const ids = c.crono.tarefas.filter(t=>t.tid===tid && t.status!=='Concluída').map(t=>t.id); if (!ids.length) return render();

     <td>${ed?`<button class="btn btn-s" data-act="formBudget" data-id="${c.id}" data-p="${x.cod}"><i data-lucide="plus"></i>Canal</button>`:''}</td></tr>`).join('')}
   <tr style="font-weight:700"><td>Total</td><td class="dir num">${moeda(R.aprov,m)}</td><td class="dir num">${moeda(R.dist,m)}</td><td class="dir num">${moeda(R.aprov-R.dist,m)}</td><td class="dir num">${moeda(R.uso,m)}</td><td class="dir num">${moeda(R.aprov-R.uso,m)}</td><td></td><td></td></tr></tbody></table></div></div>

   ${[...R.linhas].sort((a,b)=>(a.pais||'').localeCompare(b.pais||'') || b.previsto-a.previsto).map(b=>`<tr><td>${pais(b.pais)}</td><td>${h(b.canal)}</td><td>${h(b.periodo)}</td><td class="dir num">${moeda(b.previsto,m)}</td><td class="dir num">${moeda(b.utilizado,m)}</td><td class="dir num">${moeda(b.previsto-b.utilizado,m)}</td><td class="small muted">${b.hist.length?h(b.hist[0].q+' — '+b.hist[0].o):'—'}</td><td>${ed?`<button class="icone-btn" data-act="formBudget" data-id="${c.id}" data-b="${b.id}"><i data-lucide="pencil"></i></button>`:''}</td></tr>`).join('') || '<tr><td colspan="8" class="vazio">Nenhuma linha ainda. Use “+ Canal” no país para distribuir o budget aprovado.</td></tr>'}</tbody></table></div></div>

}

/* ---------- Entregáveis ---------- */
function abaEntregaveis(c){
  const f = UI.fen || (UI.fen = {sub:'pecas',visao:'tabela',canal:'',pais:'',etapa:''});
  const temOrg = temOrganico(c);
  const sub = `<div class="seg" style="margin-bottom:14px"><button class="${f.sub==='pecas'?'ativo':''}" data-act="ui" data-k="fen.sub" data-v="pecas"><i data-lucide="package"></i>Peças</button><button class="${f.sub==='conteudos'?'ativo':''}" data-act="ui" data-k="fen.sub" data-v="conteudos"><i data-lucide="languages"></i>Conteúdos por país</button>${temOrg?`<button class="${f.sub==='editorial'?'ativo':''}" data-act="ui" data-k="fen.sub" data-v="editorial"><i data-lucide="calendar-days"></i>Calendário editorial</button>`:''}</div>`;
  if (f.sub==='conteudos') return sub + conteudosPorPais(c);
  if (f.sub==='editorial' && temOrg) return sub + calendarioEditorial([c], c.id);
  const L = c.entregaveis.filter(e=>(!f.canal||e.canal===f.canal)&&(!f.pais||e.paises.includes(f.pais))&&(!f.etapa||e.etapa===f.etapa));
  const stCont = e => { const a = e.aprovacoes.filter(x=>x.tipo==='Conteúdo').pop(); return a ? (a.resultado==='Aprovado'?'Aprovado':a.resultado) : (e.etapa==='aprov_conteudo'?'Aguardando aprovação':'Pendente'); };
  const stDes = e => ({briefing:'Não iniciado',aprov_conteudo:'Não iniciado',ajuste_conteudo:'Não iniciado',producao:'Em produção',aprov_asset:'Aguardando aprovação',ajuste_asset:'Em ajustes',concluido:'Aprovado'})[e.etapa];
  const stFin = e => e.etapa==='concluido' ? 'Aprovado' : 'Pendente';
  return sub + `<div class="card"><div class="card-cab"><div class="seg"><button class="${f.visao==='tabela'?'ativo':''}" data-act="ui" data-k="fen.visao" data-v="tabela"><i data-lucide="table"></i>Tabela</button><button class="${f.visao==='cards'?'ativo':''}" data-act="ui" data-k="fen.visao" data-v="cards"><i data-lucide="layout-grid"></i>Cards</button></div>
   <div class="filtros"><select data-chg="fen.canal">${opts(c.canais,f.canal,'Todos os canais')}</select><select data-chg="fen.pais">${opts(c.paises.map(p=>[p.cod,PAISES[p.cod].n]),f.pais,'Todos os países')}</select><select data-chg="fen.etapa">${opts(Object.entries(ETAPAS_ENT),f.etapa,'Todas as etapas')}</select><button class="btn btn-p" data-act="formEnt" data-id="${c.id}"><i data-lucide="plus"></i>Novo entregável</button></div></div>
  ${f.visao==='tabela' ? `<div class="tabela-wrap"><table class="tab"><thead><tr><th>Entregável</th><th>Canal</th><th>País</th><th>Prazo</th><th>Conteúdo</th><th>Design</th><th>Aprovação final</th><th>Etapa atual</th></tr></thead><tbody>
   ${L.map(e=>`<tr class="clic" data-act="abrirEnt" data-id="${c.id}" data-e="${e.id}"><td><b>${h(e.nome)}</b><div class="small muted">${h(e.formato)} · v${e.versoes.length||0}</div></td><td>${h(e.canal)}</td><td>${e.paises.map(p=>PAISES[p].f).join(' ')}${e.paises.length>1?` <span class="small muted">(compartilhado)</span>`:''}</td><td class="num">${fd(e.prazo)}</td><td>${tag(stCont(e))}</td><td>${tag(stDes(e))}</td><td>${tag(stFin(e))}</td><td>${tag(ETAPAS_ENT[e.etapa])}</td></tr>`).join('') || '<tr><td colspan="8" class="vazio">Nenhum entregável.</td></tr>'}</tbody></table></div>`
  : `<div class="card-p">${CANAIS.filter(k=>L.some(e=>e.canal===k)).map(k=>`<h3 style="margin:6px 0 10px">${k}</h3><div class="grade g3" style="margin-bottom:16px">${L.filter(e=>e.canal===k).map(e=>`<div class="card card-p" style="cursor:pointer" data-act="abrirEnt" data-id="${c.id}" data-e="${e.id}"><div style="display:flex;justify-content:space-between;gap:6px"><b>${h(e.nome)}</b>${tag(ETAPAS_ENT[e.etapa])}</div><div class="small muted" style="margin:6px 0">${e.paises.map(p=>pais(p)).join(', ')} · ${h(e.formato)}</div><div class="small">Prazo ${fd(e.prazo)} · Conteúdo: ${h(nomeU(e.respConteudo))} · Design: ${h(nomeU(e.respDesign))}</div></div>`).join('')}</div>`).join('') || '<div class="vazio">Nenhum entregável.</div>'}</div>`}</div>`;
}
function conteudosPorPais(c){
  const m = c.master, base = IDIOMAS[c.idiomaBase];
  const des = c.paises.filter(p=>c.traducoes[p.cod] && c.traducoes[p.cod].desatualizada).length;
  return `<div class="card"><div class="card-cab"><div><h3>Conteúdo master — ${base}</h3><div class="small muted">Único e compartilhado como referência por todos os países · versão ${m.versao}${m.aprovadoEm?' · aprovado em '+fd(m.aprovadoEm):''}</div></div><div class="filtros">${tag(m.status)}<button class="btn btn-s" data-act="editMaster" data-id="${c.id}"><i data-lucide="pencil"></i>Editar master</button>${m.status==='Rascunho'?`<button class="btn btn-s" data-act="masterStatus" data-id="${c.id}" data-v="Aguardando aprovação">Enviar para aprovação</button>`:''}${m.status==='Aguardando aprovação'?`<button class="btn btn-s btn-p" data-act="masterStatus" data-id="${c.id}" data-v="Aprovado">Registrar aprovação do cliente</button><button class="btn btn-s" data-act="masterStatus" data-id="${c.id}" data-v="Rascunho">Pedir ajustes</button>`:''}</div></div>
   <div class="card-p"><div class="txtbox">${h(m.texto)||'<span class="muted">Ainda sem texto.</span>'}</div><div class="hist">${m.hist.slice(-4).map(x=>`<div>${fd(x.q)} — ${h(x.o)}</div>`).join('')}</div></div></div>
  ${des?`<div class="alerta amar" style="margin-top:12px"><i data-lucide="alert-triangle"></i><div>O master mudou depois de aprovado. <b>${des} tradução(ões) pode(m) estar desatualizada(s)</b> — nada foi alterado automaticamente; revise cada país.</div></div>`:''}
  ${m.status!=='Aprovado'?`<div class="alerta azul" style="margin-top:12px"><i data-lucide="lock"></i><div>As traduções só podem ser aprovadas depois que o master for aprovado.</div></div>`:''}
  <div class="grade g2" style="margin-top:16px">${c.paises.map(p=>{ const t = c.traducoes[p.cod], na = p.idioma===c.idiomaBase;
   return `<div class="card"><div class="card-cab"><h3>${pais(p.cod)}</h3><div class="filtros">${na?tag('Usa o original'):tag(t.desatualizada?'Desatualizada':t.status)}</div></div>
    <div class="tabela-wrap"><table class="tab"><thead><tr><th style="width:50%">Original (${c.idiomaBase})</th><th>Local (${p.idioma})</th></tr></thead><tbody><tr><td style="vertical-align:top"><div class="txtbox">${h(m.texto)||'—'}</div></td><td style="vertical-align:top">${na?'<div class="txtbox muted">Não se aplica — usa o conteúdo original.</div>':`<div class="txtbox">${h(t.texto)||'<span class="muted">Sem tradução.</span>'}</div>`}</td></tr></tbody></table></div>
    ${na?'':`<div style="padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--borda)"><span class="small muted">Tradução: ${h(nomeU(t.resp))} · Validação: ${h(nomeU(t.validador))}${t.prazo?' · prazo '+fd(t.prazo):''}${t.versaoMaster?' · baseada no master v'+t.versaoMaster:''}</span><button class="btn btn-s" style="margin-left:auto" data-act="editTrad" data-id="${c.id}" data-p="${p.cod}"><i data-lucide="pencil"></i>Abrir</button></div>`}</div>`; }).join('')}</div>`;
}

/* ---------- Mercados e países ---------- */
function abaMercados(c){
  const f = UI.fme || (UI.fme = {visao:'cards'});
  const linhas = c.paises.map(p=>{
    const t = c.traducoes[p.cod], na = p.idioma===c.idiomaBase;
    const ents = c.entregaveis.filter(e=>e.paises.includes(p.cod));
    const tp = c.crono.tarefas.filter(x=>x.pais===p.cod);
    const risco = riscosPais(c).find(r=>r.cod===p.cod);
    const geral = risco ? 'Em risco' : tp.length && tp.every(x=>x.status==='Concluída') ? 'Concluída' : tp.some(x=>x.status!=='Não iniciada') ? 'Em andamento' : 'Não iniciada';
    return {p,t,na,geral,risco,
      cont: c.master.status==='Aprovado' ? 'Master aprovado' : 'Master: '+c.master.status.toLowerCase(),
      trad: na ? 'Não se aplica' : (t.desatualizada?'Desatualizada':t.status),
      assets: ents.length ? `${ents.filter(e=>e.etapa==='concluido').length}/${ents.length} aprovados` : 'Nenhum',
      aprov: `${ents.filter(e=>e.etapa==='aprov_conteudo'||e.etapa==='aprov_asset').length} pendente(s)`};
  });
  return `<div class="card"><div class="card-cab"><div class="seg"><button class="${f.visao==='cards'?'ativo':''}" data-act="ui" data-k="fme.visao" data-v="cards"><i data-lucide="layout-grid"></i>Cards</button><button class="${f.visao==='tabela'?'ativo':''}" data-act="ui" data-k="fme.visao" data-v="tabela"><i data-lucide="table"></i>Tabela consolidada</button></div><button class="btn btn-s" data-act="editarCampanha" data-id="${c.id}"><i data-lucide="plus"></i>Adicionar ou remover países</button></div>
  ${f.visao==='cards' ? `<div class="card-p grade g3">${linhas.map(l=>`<div class="card pcard"><div class="top"><div style="display:flex;gap:10px;align-items:center"><span class="bandeira">${PAISES[l.p.cod].f}</span><div><h3>${PAISES[l.p.cod].n} — ${l.p.cod}</h3><div class="small muted">${REGIOES[PAISES[l.p.cod].r]}</div></div></div>${tag(l.geral==='Em risco'?'Atrasada':l.geral)}</div>
    <div style="margin-top:12px">
     <div class="st-lin"><span class="muted">Idioma local / base</span><span>${IDIOMAS[l.p.idioma]} / ${IDIOMAS[c.idiomaBase]}</span></div>
     <div class="st-lin"><span class="muted">Responsável local</span><span>${h(nomeU(l.p.respLocal))}</span></div>
     <div class="st-lin"><span class="muted">Lançamento</span><b>${fds(l.p.lancamento)}</b></div>
     <div class="st-lin"><span class="muted">Conteúdos</span><span>${h(l.cont)}</span></div>
     <div class="st-lin"><span class="muted">Traduções</span>${tag(l.trad)}</div>
     <div class="st-lin"><span class="muted">Assets</span><span>${l.assets}</span></div>
     <div class="st-lin"><span class="muted">Aprovações</span><span>${l.aprov}</span></div></div>
    ${l.risco?`<div class="alerta verm" style="margin:10px 0 0;padding:8px 10px"><i data-lucide="flag"></i>${h(l.risco.motivo)}</div>`:''}
    ${l.p.obs?`<div class="small" style="margin-top:8px">${h(l.p.obs)}</div>`:''}${l.p.links?`<div class="small" style="margin-top:4px"><a href="${h(l.p.links)}" target="_blank" rel="noopener">Links e arquivos</a></div>`:''}
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-s" data-act="editPais" data-id="${c.id}" data-p="${l.p.cod}"><i data-lucide="pencil"></i>Editar</button><button class="btn btn-s" data-act="filtrarPais" data-id="${c.id}" data-p="${l.p.cod}"><i data-lucide="gantt-chart"></i>Cronograma do país</button></div></div>`).join('')}</div>`
  : `<div class="tabela-wrap"><table class="tab"><thead><tr><th>País</th><th>Região</th><th>Idioma</th><th>Responsável local</th><th>Lançamento</th><th>Geral</th><th>Conteúdos</th><th>Traduções</th><th>Assets</th><th>Aprovações</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${pais(l.p.cod)}</td><td>${PAISES[l.p.cod].r}</td><td>${IDIOMAS[l.p.idioma]}</td><td>${h(nomeU(l.p.respLocal))}</td><td class="num">${fd(l.p.lancamento)}</td><td>${tag(l.geral==='Em risco'?'Atrasada':l.geral)}</td><td class="small">${h(l.cont)}</td><td>${tag(l.trad)}</td><td class="small">${l.assets}</td><td class="small">${l.aprov}</td></tr>`).join('')}</tbody></table></div>`}</div>`;
}

/* =====================================================================
   11. CRONOGRAMA ANUAL
   ===================================================================== */
function pgAnual(){
  migalha([['Cronograma anual']]);
  const f = UI.fan || (UI.fan = {ano:'2027',modo:'veic',cliente:'',pais:'',resp:'',canal:'',status:'',mes:''});
  const ano = f.ano, i0 = ano+'-01-01', nDias = difDias(i0, (+ano+1)+'-01-01');
  let L = ativas().filter(c=>(!f.cliente||c.clienteId===f.cliente)&&(!f.pais||c.paises.some(p=>p.cod===f.pais))&&(!f.resp||c.respAtendimento===f.resp)&&(!f.canal||c.canais.includes(f.canal))&&(!f.status||c.status===f.status));
  const per = c => f.modo==='veic' ? [c.lancamento, c.fimVeiculacao] : [inicioPlan(c), c.lancamento];
  L = L.filter(c=>{ const [a,b] = per(c); return b>=i0 && a<=ano+'-12-31' && (!f.mes || (a.slice(0,7)<=ano+'-'+f.mes && b.slice(0,7)>=ano+'-'+f.mes)); }).sort((a,b)=>per(a)[0]<per(b)[0]?-1:1);
  const pct = s => Math.max(0,Math.min(100, difDias(i0,s)/nDias*100));
  const cores = {cl1:'#2f8a5a',cl2:'#1d7585',cl3:'#7a5bb0'};
  const alertas = [];
  for (const c of ativas()) { if (c.status==='Concluída') continue; const ini = inicioPlan(c), d = difDias(HOJE,ini);
    if (naoIniciada(c) && ini<HOJE) alertas.push(['verm',`<b>${h(c.nome)}</b>: o planejamento deveria ter começado em ${fd(ini)}.`]);
    else if (naoIniciada(c) && d<=15) alertas.push(['amar',`<b>${h(c.nome)}</b> precisa começar nos próximos 15 dias (${fd(ini)}).`]);
    else if (naoIniciada(c) && d<=30) alertas.push(['azul',`<b>${h(c.nome)}</b> precisa começar nos próximos 30 dias (${fd(ini)}).`]);
    if (!naoIniciada(c) && saude(c).cor==='verm') alertas.push(['verm',`<b>${h(c.nome)}</b>: cronograma com etapas atrasadas.`]);
    const dl = difDias(HOJE,c.lancamento), pend = c.entregaveis.filter(e=>e.etapa!=='concluido').length;
    if (dl>=0 && dl<=30 && pend) alertas.push(['amar',`<b>${h(c.nome)}</b> lança em ${dl} dias e tem ${pend} entregável(is) pendente(s).`]); }
  return `<div class="cab"><div><h1>Cronograma anual</h1><p>${f.modo==='veic'?'Quando cada campanha estará no ar (lançamento → fim da veiculação).':'Quando cada campanha precisa começar a ser trabalhada (briefing → lançamento), pelo cronograma reverso.'}</p></div>
   <div class="seg"><button class="${f.modo==='veic'?'ativo':''}" data-act="ui" data-k="fan.modo" data-v="veic"><i data-lucide="radio-tower"></i>Veiculação</button><button class="${f.modo==='prod'?'ativo':''}" data-act="ui" data-k="fan.modo" data-v="prod"><i data-lucide="hammer"></i>Produção e planejamento</button></div></div>
  ${alertas.map(([t,x])=>`<div class="alerta ${t}"><i data-lucide="bell"></i><div>${x}</div></div>`).join('')}
  <div class="card"><div class="card-cab"><div class="filtros"><select data-chg="fan.ano">${opts(['2026','2027'],f.ano)}</select><select data-chg="fan.cliente">${opts(S.clientes.map(c=>[c.id,c.nome]),f.cliente,'Todos os clientes')}</select><select data-chg="fan.pais">${opts(Object.entries(PAISES).map(([k,p])=>[k,p.n]),f.pais,'Todos os países')}</select><select data-chg="fan.resp">${opts(S.usuarios.filter(u=>u.area==='Atendimento').map(u=>[u.id,u.nome]),f.resp,'Todos os responsáveis')}</select><select data-chg="fan.canal">${opts(CANAIS,f.canal,'Todos os canais')}</select><select data-chg="fan.status">${opts(ST_CAMP,f.status,'Todos os status')}</select><select data-chg="fan.mes">${opts(MESES.map((m,i)=>[String(i+1).padStart(2,'0'),m]),f.mes,'Todos os meses')}</select></div></div>
  <div class="anual"><div class="an-int"><div class="an-lin" style="min-height:30px"><div class="nome small muted">Campanha</div><div class="an-cab">${MESES.map((m,i)=>`<div class="an-mes" style="left:${pct(ano+'-'+String(i+1).padStart(2,'0')+'-01')}%;padding:6px">${m.slice(0,3)}</div>`).join('')}</div></div>
   ${L.map(c=>{ const [a,b] = per(c); const l = pct(a), w = Math.max(.8, pct(b)-l);
     return `<div class="an-lin"><div class="nome"><b>${h(c.nome)}</b>${h(cliente(c.clienteId).nome)} · ${c.paises.map(p=>PAISES[p.cod].f).join('')}</div><div class="an-trilho">${MESES.map((m,i)=>`<div class="an-mes" style="left:${pct(ano+'-'+String(i+1).padStart(2,'0')+'-01')}%"></div>`).join('')}
      ${HOJE.startsWith(ano)?`<div style="position:absolute;top:0;bottom:0;left:${pct(HOJE)}%;width:2px;background:#e0a33a"></div>`:''}
      <div class="an-barra" style="left:${l}%;width:${w}%;background:${cores[c.clienteId]||'#1d7585'};${f.modo==='prod'?'opacity:.85;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.15) 0 6px,transparent 6px 12px)':''}" onclick="location.hash='#/campanha/${c.id}/${f.modo==='veic'?'visao':'cronograma'}'" title="${h(c.nome)}\n${f.modo==='veic'?'No ar':'Produção'}: ${fd(a)} → ${fd(b)}\nStatus: ${c.status} · ${nomeU(c.respAtendimento)}">${fdc(a)} → ${fdc(b)} · ${h(c.status)}</div></div></div>`; }).join('') || '<div class="vazio">Nenhuma campanha nesse período.</div>'}

function calendarioEditorial(cs, campId){
  const f = UI.fed || (UI.fed = {mes:'2026-12',visao:'mes',rede:'',pais:'',camp:''});
  let posts = cs.flatMap(c=>c.posts.map(p=>Object.assign({},p,{campId:c.id,campNome:c.nome})));
  if (!campId && f.camp) posts = posts.filter(p=>p.campId===f.camp);
  if (f.rede) posts = posts.filter(p=>p.rede===f.rede); if (f.pais) posts = posts.filter(p=>p.pais===f.pais);
  const [y,m] = f.mes.split('-').map(Number);
  let ini, nDias;
  if (f.visao==='mes') { const p1 = f.mes+'-01'; ini = addDias(p1, -((dow(p1)+6)%7)); const ult = addDias(iso(new Date(Date.UTC(y,m,1))),-1); nDias = difDias(ini, addDias(ult, (7-dow(ult))%7))+1; }
  else { const base = f.semana || f.mes+'-01'; ini = addDias(base, -((dow(base)+6)%7)); nDias = 7; }
  const redes = ['Instagram','Facebook','TikTok','LinkedIn','YouTube','X'];
  const corRede = {Instagram:'#c13584',Facebook:'#1877f2',TikTok:'#111',LinkedIn:'#0a66c2',YouTube:'#d00',X:'#444'};
  let cel = ['seg','ter','qua','qui','sex','sáb','dom'].map(d=>`<div class="dsem">${d}</div>`).join('');
  for (let i=0;i<nDias;i++) { const d = addDias(ini,i), ps = posts.filter(p=>p.data===d);
    cel += `<div class="dia ${d.slice(0,7)!==f.mes&&f.visao==='mes'?'fora':''} ${d===HOJE?'hoje':''}" data-drop="post" data-d="${d}" style="${f.visao==='sem'?'min-height:220px':''}"><span class="n">${+d.slice(8)}</span>${ps.map(p=>`<div class="post" draggable="true" data-drag="${p.id}" data-c="${p.campId}" data-act="formPost" data-id="${p.campId}" data-p="${p.id}" style="border-left-color:${corRede[p.rede]||'#1d7585'}" title="${h(p.tema)} — ${p.rede} · ${p.pais} · ${p.status}">${PAISES[p.pais]?PAISES[p.pais].f:''} ${h(p.tema)}</div>`).join('')}</div>`; }
  const titulo = f.visao==='mes' ? MESES[m-1]+' de '+y : 'Semana de '+fd(ini);
  return `<div class="card"><div class="card-cab"><div style="display:flex;gap:8px;align-items:center"><button class="icone-btn" data-act="edNav" data-d="-1"><i data-lucide="chevron-left"></i></button><h3 style="min-width:170px;text-align:center;text-transform:capitalize">${titulo}</h3><button class="icone-btn" data-act="edNav" data-d="1"><i data-lucide="chevron-right"></i></button>
   <div class="seg"><button class="${f.visao==='mes'?'ativo':''}" data-act="ui" data-k="fed.visao" data-v="mes">Mês</button><button class="${f.visao==='sem'?'ativo':''}" data-act="ui" data-k="fed.visao" data-v="sem">Semana</button></div></div>
   <div class="filtros">${campId?'':`<select data-chg="fed.camp">${opts(cs.map(c=>[c.id,c.nome]),f.camp,'Todas as campanhas')}</select>`}<select data-chg="fed.rede">${opts(redes,f.rede,'Todas as redes')}</select><select data-chg="fed.pais">${opts([...new Set(cs.flatMap(c=>c.paises.map(p=>p.cod)))].map(k=>[k,PAISES[k].n]),f.pais,'Todos os países')}</select><button class="btn btn-p" data-act="formPost" data-id="${campId||''}"><i data-lucide="plus"></i>Nova publicação</button></div></div>

function lerFormCampanha(){

function validarCampanha(d){
  const err = [];
  if (!d.clienteId) err.push('Escolha o cliente.'); if (!d.nome) err.push('Informe o nome da campanha.');
  if (!d.lancamento) err.push('Informe a data de lançamento.'); if (!d.fimVeiculacao) err.push('Informe o fim da veiculação.');
  if (d.lancamento && d.fimVeiculacao && d.fimVeiculacao < d.lancamento) err.push('O fim da veiculação não pode ser antes do lançamento.');
  if (!(d.canais||[]).length) err.push('Marque pelo menos um canal.');
  for (const k of (d.canais||[])) { const cf = (d.canaisCfg||{})[k] || cfgVazio();
    if (!cf.paises.length) err.push(`Selecione os países de ${k}.`);
    if (!(cf.orcamento>0)) err.push(`Informe o budget total de ${k}.`);
    if (cf.divisao==='pct' && cf.paises.length) { const sp = cf.paises.reduce((s,p)=>s+(+p.pct||0),0); if (Math.abs(sp-100) > 0.01) err.push(`${k}: a divisão por país soma ${+sp.toFixed(2)}%. Ajuste para 100%.`); } }
  if (!d.marca) err.push('Escolha a marca da campanha.');
  if (!(d.objetivos||[]).length) err.push('Escolha o objetivo da campanha (geração de leads e/ou awareness).');

  const dts = [d.lancamento, ...d.paises.map(p=>p.lancamento)].filter(Boolean);
  for (const x of new Set(dts)) { const m = ctx().motivo(x,'AG'); if (m) err.push(`A data ${fd(x)} cai em ${m}. Escolha uma data útil (o sistema não muda a data sozinho).`); }
  if (d.paises.length && d.paises.every(p=>p.lancamento!==d.lancamento)) err.push('A data de lançamento da campanha deve ser a de pelo menos um país (normalmente a primeira).');
  return err;
}
/* divide o budget total entre os países (igual ou por %); arredonda em centavos e ajusta a sobra no primeiro país */
function sincronizarBudgetCanais(c){
  if (!c.canaisCfg || !(c.canais||[]).length) return;
  const usadas = [];
  for (const k of c.canais) for (const p of ((c.canaisCfg[k]||{}).paises||[])) {
    const prev = Math.round((+p.budget||0)*100)/100;
    let b = c.budgets.find(x=>x.pais===p.cod && x.canal===k && !usadas.includes(x.id));

function lerCanaisCfg(fm, canais){
  const cfg = {};
  for (const k of canais) {
    const ant = JSON.parse(JSON.stringify((rascunho.canaisCfg||{})[k] || cfgVazio()));
    const sec = [...fm.querySelectorAll('.sec-canal')].find(x=>x.dataset.canal===k);
    if (!ant.moeda) ant.moeda = rascunho.moeda || 'BRL';
    if (sec) { const o = sec.querySelector('.c-orc'); if (o) ant.orcamento = Math.max(0, +o.value||0); const mo = sec.querySelector('.c-moe'); if (mo) ant.moeda = mo.value;
      if (ant.divisao==='pct') ant.paises.forEach(p=>{ const i = sec.querySelector(`.c-pct[data-p="${p.cod}"]`); if (i) p.pct = i.value==='' ? null : +i.value; }); }
    dividirBudget(ant.paises, ant.orcamento, ant.divisao);

function consolidarCanais(d){

  else { const base = Math.floor(total*100/paises.length)/100; paises.forEach(p=>p.budget = base); paises[0].budget = Math.round((total - base*(paises.length-1))*100)/100; } }

function abrirFormCampanha(c, clienteId){

function impactoFeriados(lista){
  const c2 = criarCtx(lista), out = [];
  for (const c of ativas()) { if (c.status==='Concluída') continue;
    const r = calcularCronograma(c, {ctx:c2, fixos:fixosDe(c.crono.tarefas), naoAntesDe:hojeUtil()});
    const ant = Object.fromEntries(c.crono.tarefas.map(t=>[t.id,t]));
    const mud = r.tarefas.filter(t=>ant[t.id] && (ant[t.id].ES!==t.ES || ant[t.id].EF!==t.EF)).map(t=>Object.assign({antes:ant[t.id]},t));
    if (mud.length) out.push({c, mud, inv:r.inviaveis.length>0}); }
  return out;
}
function avisarImpacto(){ const imp = impactoFeriados(S.feriados); if (!imp.length) return;
  abrirModal('Calendário de feriados alterado', `<p>${imp.length} campanha(s) teriam datas diferentes com o calendário novo:</p><ul>${imp.map(i=>`<li><b>${h(i.c.nome)}</b> — ${i.mud.length} etapa(s)</li>`).join('')}</ul><p class="small muted">Etapas concluídas e em andamento são mantidas. A versão atual de cada cronograma fica no histórico.</p>`,
    `<button class="btn" data-act="fechar">Agora não</button><button class="btn btn-p" data-act="recalcAfetadas">Recalcular essas campanhas</button>`); }

      else if ((t.pessoa||'')!==v) { t.hist.push({q:HOJE,o:`Responsável: ${t.pessoa||'—'} → ${v}`}); t.pessoa = v; } }
    registrar(`${k==='statusGrupo'?'Status':'Responsável'} de “${alvo[0].nome}”${k==='pessoaTarefa'&&alvo[0].pais?' ('+alvo[0].pais+')':alvo.length>1?' (todos os países)':''} em “${c.nome}”: ${v}`); return render(); }
  if (k==='statusTarefa') { const c = camp(el.dataset.id), t = c.crono.tarefas.find(x=>x.id===el.dataset.t); (t.hist = t.hist||[]).push({q:HOJE,o:`Status: ${t.status} → ${v}`}); t.status = v; registrar(`Etapa “${t.nome}${t.pais?' ('+t.pais+')':''}” de “${c.nome}”: ${v}`); return render(); }
  if (k==='statusAcao_antigo') { const c = camp(el.dataset.id), a = c.acoes.find(x=>x.id===el.dataset.a); a.hist.push({q:HOJE,o:`Status: ${a.status} → ${v}`}); a.status = v; registrar(`Ação “${a.nome}”: ${v}`); return render(); }
  if (k==='baseRegiao') { S.baseRegiao[el.dataset.r] = v; registrar(`Idioma-base de ${REGIOES[el.dataset.r]}: ${IDIOMAS[v]}`); return toast('Salvo.'); }
  if (k==='lancForm') { const m = el.value && ctx().motivo(el.value,'AG'); $('#aviso-lanc').innerHTML = m ? `<div class="alerta verm"><i data-lucide="alert-circle"></i>${fd(el.value)} cai em ${h(m)}. Escolha uma data útil.</div>` : ''; icones(); return; }
  const [o,p] = k.split('.'); if (UI[o]) { UI[o][p] = v; render(); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-chg="fc.busca"]'); if (!el) return; UI.fc.busca = el.value; clearTimeout(window._tb); window._tb = setTimeout(()=>{ render(); const i = $('[data-chg="fc.busca"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }, 300); });
/* arrastar e soltar (Kanban e calendário editorial) */
let arrastando = null;
document.addEventListener('dragstart', e => { const el = e.target.closest('[data-drag]'); if (el) { arrastando = {id:el.dataset.drag, c:el.dataset.c}; e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const z = e.target.closest('[data-drop]'); if (z && arrastando) { e.preventDefault(); z.classList.add('sobre'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest('[data-drop]'); if (z) z.classList.remove('sobre'); });
document.addEventListener('drop', e => { const z = e.target.closest('[data-drop]'); if (!z || !arrastando) return; e.preventDefault();
  if (z.dataset.drop==='acao') { const c = camp(z.dataset.id), a = c.crono.tarefas.find(x=>x.id===arrastando.id); if (a && a.status!==z.dataset.s) { (a.hist = a.hist||[]).push({q:HOJE,o:`Status: ${a.status} → ${z.dataset.s}`}); a.status = z.dataset.s; registrar(`Ação “${a.nome}”${a.pais?' ('+a.pais+')':''}: ${a.status}`); } }
  if (z.dataset.drop==='post') { const c = camp(arrastando.c), p = c && c.posts.find(x=>x.id===arrastando.id); if (p && p.data!==z.dataset.d) { registrar(`Publicação “${p.tema}” movida de ${fd(p.data)} para ${fd(z.dataset.d)}`); p.data = z.dataset.d; } }
  arrastando = null; render(); });
/* arrastar barras do Gantt (mover ou mudar a duração) */
let gDrag = null;
document.addEventListener('pointerdown', e => { const b = e.target.closest('.g-barra[data-t],.g-barra[data-grupo]'); if (!b || e.button!==0) return;
  const c = camp(b.dataset.c); if (!c) return;
  if (b.dataset.grupo) { const ins = c.crono.tarefas.filter(x=>x.tid===b.dataset.grupo); if (!ins.length) return;
    fecharMenuBarra(); gDrag = {b, c, grupo:b.dataset.grupo, ins, t:ins.reduce((m,x)=>x.ES<m.ES?x:m, ins[0]), fixa:!!b.dataset.fixa, solto:e.shiftKey, modo: e.target.classList.contains('g-alca-ini') ? 'ini' : e.target.classList.contains('g-alca') ? 'fim' : 'mover', x0:e.clientX, left:parseFloat(b.style.left), width:parseFloat(b.style.width), dd:0};
    try { b.setPointerCapture(e.pointerId); } catch(_){} b.classList.add('arrastando'); e.preventDefault(); return; }
  const t = c.crono.tarefas.find(x=>x.id===b.dataset.t); if (!t) return;
  fecharMenuBarra(); gDrag = {b, c, t, fixa: !!b.dataset.fixa, solto: e.shiftKey, modo: e.target.classList.contains('g-alca-ini') ? 'ini' : e.target.classList.contains('g-alca') ? 'fim' : 'mover', x0:e.clientX, left:parseFloat(b.style.left), width:parseFloat(b.style.width), dd:0};
  try { b.setPointerCapture(e.pointerId); } catch(_){} b.classList.add('arrastando'); e.preventDefault(); });
document.addEventListener('pointermove', e => { if (!gDrag || gDrag.fixa) return; const g = gDrag, W = +(g.b.closest('.gantt')||{dataset:{}}).dataset.w || 22;
  let dd = Math.round((e.clientX - g.x0)/W); if (g.modo==='fim') dd = Math.max(dd, -Math.round(g.width/W)+1); if (g.modo==='ini') dd = Math.min(dd, Math.round(g.width/W)-1);
  if (dd===g.dd) return; g.dd = dd;
  if (g.modo==='mover') g.b.style.left = (g.left + dd*W)+'px'; else if (g.modo==='ini') { g.b.style.left = (g.left + dd*W)+'px'; g.b.style.width = (g.width - dd*W)+'px'; } else g.b.style.width = (g.width + dd*W)+'px';
  const n = novasDatasArraste(g.t, g.modo, dd);
  if (g.grupo) { let dica = g.b.querySelector('.g-dica'); if (!dica) { dica = document.createElement('span'); dica.className = 'g-dica'; g.b.appendChild(dica); }
    dica.textContent = dd ? `${g.ins.length} países · ${g.modo==='mover'?'mover':g.modo==='ini'?'início':'fim'} ${dd>0?'+':''}${dd} dia(s)` : ''; dica.style.display = dd ? '' : 'none'; return; }
  let dica = g.b.querySelector('.g-dica'); if (!dica) { dica = document.createElement('span'); dica.className = 'g-dica'; g.b.appendChild(dica); }
  dica.textContent = dd ? `${fdc(n.ES)} → ${fdc(n.EF)} · ${uteisEntre(n.ES,n.EF,g.t.cal,ctx())+1} d.u.` : ''; dica.style.display = dd ? '' : 'none'; });
function fecharMenuBarra(){ const m = document.getElementById('menu-barra'); if (m) m.remove(); }
function menuBarra(c, t, x, y){ fecharMenuBarra();
  const st = statusExib(t), ed = ehEquipe(), b = (v, ic, txt, cls='') => `<button class="mb-op ${cls}" data-act="statusBarra" data-id="${c.id}" data-t="${t.id}" data-v="${v}"><i data-lucide="${ic}"></i>${txt}</button>`;
  const d = document.createElement('div'); d.id = 'menu-barra'; d.className = 'menu-barra';
  d.innerHTML = `<div class="mb-tit">${h(t.nome)}${t.pais?' — '+t.pais:''}</div><div class="small muted" style="margin:2px 0 8px">${fdc(t.ES)} → ${fdc(t.EF)} · <span class="farol ${farolDe(t)}" style="padding:1px 7px 1px 18px;background-position:6px center">${h(st)}</span></div>
    ${ed ? (t.status!=='Concluída' ? b('Concluída','check-circle-2','Marcar como concluída','mb-ok') : b('Em andamento','rotate-ccw','Reabrir (em andamento)'))
      + (t.status!=='Em andamento' && t.status!=='Concluída' ? b('Em andamento','play','Em andamento') : '')
      + (t.status!=='Aguardando cliente' && t.status!=='Concluída' ? b('Aguardando cliente','hourglass','Aguardando cliente') : '') : ''}
    ${ed && t.pais ? (()=>{ const irm = c.crono.tarefas.filter(x=>x.tid===t.tid); return irm.length>1 && irm.some(x=>x.status!=='Concluída') ? `<div class="mb-sep"></div><button class="mb-op mb-ok" data-act="statusBarra" data-id="${c.id}" data-g="${t.tid}" data-v="Concluída"><i data-lucide="check-check"></i>Concluir em todos os ${irm.length} países</button>` : ''; })() : ''}
    <button class="mb-op" data-act="formAcao" data-id="${c.id}" data-a="${t.id}"><i data-lucide="file-text"></i>Abrir detalhes</button>`;
  document.body.appendChild(d);
  const r = d.getBoundingClientRect(); d.style.left = Math.max(8, Math.min(x+8, innerWidth - r.width - 8))+'px'; d.style.top = Math.max(8, Math.min(y+10, innerHeight - r.height - 8))+'px';
  icones(); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('#menu-barra') && !e.target.closest('.g-barra')) fecharMenuBarra(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') fecharMenuBarra(); });
function menuGrupo(c, tid, x, y){ fecharMenuBarra();
  const ins = c.crono.tarefas.filter(t=>t.tid===tid), conc = ins.filter(t=>t.status==='Concluída').length, ed = ehEquipe();
  const b = (v, ic, txt, cls='') => `<button class="mb-op ${cls}" data-act="statusBarra" data-id="${c.id}" data-g="${tid}" data-v="${v}"><i data-lucide="${ic}"></i>${txt}</button>`;
  const d = document.createElement('div'); d.id = 'menu-barra'; d.className = 'menu-barra';
  d.innerHTML = `<div class="mb-tit">${h(ins[0].nome)}</div><div class="small muted" style="margin:2px 0 8px">${conc} de ${ins.length} países concluídos · <span class="farol ${farolGrupo(ins)}" style="padding:1px 7px 1px 18px;background-position:6px center">${conc===ins.length?'Concluída':'Em aberto'}</span></div>
    ${ed ? (conc<ins.length ? b('Concluída','check-check','Concluir todos os países','mb-ok') : b('Em andamento','rotate-ccw','Reabrir todos os países')) + (conc<ins.length ? b('Em andamento','play','Todos em andamento') : '') : ''}
    <div class="small muted" style="padding:6px 8px 0">Para mexer em um país só, abra a etapa pela setinha e use a barra do país.</div>`;
  document.body.appendChild(d);
  const r = d.getBoundingClientRect(); d.style.left = Math.max(8, Math.min(x+8, innerWidth - r.width - 8))+'px'; d.style.top = Math.max(8, Math.min(y+10, innerHeight - r.height - 8))+'px';
  icones(); }

function fimArraste(e, cancelar){ if (!gDrag) return; const g = gDrag; gDrag = null; g.b.classList.remove('arrastando');
  if (g.grupo) { if (!cancelar && !g.dd) return menuGrupo(g.c, g.grupo, e.clientX, e.clientY); if (cancelar || !g.dd) return render(); return moverGrupo(g.c, g.grupo, g.dd, g.solto ? DEP_ATIVAS : !DEP_ATIVAS, g.modo); }
  if (!cancelar && !g.dd) return menuBarra(g.c, g.t, e.clientX, e.clientY);   // clique sem arrastar: menu da etapa
  const n = novasDatasArraste(g.t, g.modo, g.dd);
  if (cancelar || !g.dd || (n.ES===g.t.ES && n.EF===g.t.EF)) return render();
  proporMovimento(g.c, g.t, n.ES, n.EF, g.solto ? DEP_ATIVAS : !DEP_ATIVAS); render(); }
function proporMovimento(c, t, ES, EF, soltar){ const g = {c, t};
  const n = {ES, EF}, conf = conflitosMov(g.c, g.t, n.ES, n.EF);
  UI.pendMov = {cid:g.c.id, tid:g.t.id, ES:n.ES, EF:n.EF, sobrepoe:conf.length>0};
  if (!soltar) return ACT.movAplicar('conectado');
  return ACT.movAplicar(false);
  // simula o "empurrar" para mostrar o efeito antes de escolher
  const sim = JSON.parse(JSON.stringify(g.c)), mv = moverTarefa(sim, g.t.id, n.ES, n.EF, true);
  const lancSim = sim.crono.inviaveis, nome = t => h(t.nome)+(t.pais?' ('+t.pais+')':'');
  abrirModal('Ajustar etapa', `<p style="margin-top:0"><b>${nome(g.t)}</b> passa para <b>${fds(n.ES)} → ${fds(n.EF)}</b>. Com isso, ela invade ${conf.length===1?'a etapa seguinte':conf.length+' etapas seguintes'}:</p>
    <ul class="lista-simples">${conf.slice(0,6).map(s=>`<li>${nome(s)}<span class="small muted" style="margin-left:auto">começa ${fds(s.ES)}</span></li>`).join('')}${conf.length>6?`<li class="muted small">e mais ${conf.length-6}</li>`:''}</ul>
    <div class="grade g2" style="margin-top:14px"><div class="card card-p"><b>Sobrepor</b><p class="small muted" style="margin:6px 0 0">As próximas etapas ficam onde estão e correm em paralelo com esta. Nenhuma outra data muda.</p></div>
    <div class="card card-p"><b>Empurrar para frente</b><p class="small muted" style="margin:6px 0 0">${mv.length} etapa(s) seguinte(s) andam para frente, mantendo a duração. O lançamento continua em ${fds(g.c.lancamento)}.${mv.travadas.length?` <span style="color:#b3392f">${mv.travadas.length} etapa(s) chegam ao limite antes do lançamento e ficam sobrepostas.</span>`:''}</p></div></div>`,
    `<button class="btn" data-act="fechar">Cancelar</button><button class="btn" data-act="movSobrepor"><i data-lucide="layers"></i>Sobrepor</button><button class="btn btn-p" data-act="movEmpurrar"><i data-lucide="chevrons-right"></i>Empurrar as próximas</button>`); }
document.addEventListener('pointerup', e => fimArraste(e, false));
document.addEventListener('pointercancel', e => fimArraste(e, true));
window.addEventListener('hashchange', render);
let _rs; window.addEventListener('resize', () => { clearTimeout(_rs); _rs = setTimeout(()=>{ if ($('.gantt') && !gDrag) render(); }, 250); });

/* =====================================================================
   16. INÍCIO
   ===================================================================== */
iniciar();
</script>
